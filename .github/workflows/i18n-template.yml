name: i18n template

# Fails when the committed gettext template `i18n/oc8.pot` no longer matches
# the `t("English", ...)` strings in frontend/src. Weblate reads that file to
# offer new strings to translators, so it has to stay current. This is a check,
# not a bot: the author regenerates and commits the file.

on:
  push:
    paths:
      - "frontend/src/**"
      - "frontend/scripts/i18n-export-template.mjs"
      - "i18n/oc8.pot"
      - ".github/workflows/i18n-template.yml"
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/scripts/i18n-export-template.mjs"
      - "i18n/oc8.pot"
      - ".github/workflows/i18n-template.yml"

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate the template
        working-directory: frontend
        run: npm run i18n:template

      - name: Fail if i18n/oc8.pot is out of date
        run: |
          if ! git diff --exit-code -- i18n/oc8.pot; then
            echo "::error file=i18n/oc8.pot::i18n/oc8.pot is out of date. Run 'npm run i18n:template' in frontend/ and commit the result."
            exit 1
          fi
