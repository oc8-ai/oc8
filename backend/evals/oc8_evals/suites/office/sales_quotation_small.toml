id = "sales_quotation_small"
systems = ["odoo"]
origin = "manual"
scenario = "sales_quotation_small"
autonomy = "autonomous"
expects_question = false
expects_approval = false
task_text = """
Create a quotation for the customer "{prefix}Nordlicht AG" with these lines:
- 2 × "{prefix}Consulting day" at the list price
- 1 × "{prefix}Onboarding package" at the list price
Leave it as a draft quotation; do not confirm it and do not send it.
"""

[frame_tools.odoo]
enabled = true
read = true
modify = true

[budget]
max_steps = 30
max_tokens = 300000
