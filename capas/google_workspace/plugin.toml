# Google Workspace as both a knowledge source AND an MCP tool pack -- ONE
# plugin, deliberately, same reasoning as microsoft365 (design doc §1):
# neither the connector registry nor tool-pack materialization gates on this
# file's `type` field.
#
# This file is the slim core only. The tool pack lives in tool_pack.toml, the
# guardrail presets and the curated library in guardrails/<key>.toml, and the
# setup form in setup/*.toml (design §2/§3).

[plugin]
name = "google_workspace"
label = "Google Workspace"
version = "1.2.0"
type = "tool_pack"
trust = "first_party"
summary = "Connect Google Workspace — Shared Drive knowledge base, plus Gmail, Calendar, Drive, Docs, Sheets and Slides tools"
permissions = ["knowledge:write", "mcp:connect", "secrets:use"]
capabilities = ["integration:google_workspace"]

[plugin.entry_points]
connectors = "connector.connector:register"
# The `mail.received` poller (events/source.py): core polls a mailbox with the
# service account the agent is fixed to for this capa's tools, delegated to
# that mailbox with the setup's own delegated scope, and starts the agent per
# new mail.
event_sources = "events.source:register"

[[plugin.triggers]]
type = "mail.received"
label = "New email"
description = "Starts the agent when a new mail arrives in a Gmail mailbox. The mail is handed to the run as data, never as instructions."
polled = true
# The trigger editor's tab.
editor_label = "On new email"

# The mailbox watched (the service account acts as it), by default the
# setup's default mailbox.
[[plugin.triggers.config]]
key = "mailbox"
label = "Mailbox"
default_from = "default_mailbox"

# The Gmail label watched: a label ID such as INBOX or Label_12.
[[plugin.triggers.config]]
key = "label"
label = "Label"
default = "INBOX"
