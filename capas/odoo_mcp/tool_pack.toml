# The tool-pack half of the odoo_mcp plugin. This file's TOP LEVEL *is* the
# `tool_pack` table (design §2/§3) -- there is no `[plugin.tool_pack]` wrapper.
# The guardrail presets that used to sit inside these connections now live one
# file per key in guardrails/, alongside the curated use-case library.

[[connections]]
key = "primary"
name = "odoo"
transport = "stdio"
server_url = ""
# Which credential_types/*.toml entry a login for this connection must be --
# lets the Hire dialog / NarrowingEditor's "New login" flow skip asking the
# operator to pick a credential type by hand (agent tool login selection
# design, Task 2).
credential_type = "odoo_login"

# env var name -> the credential_type's own field key (odoo_login.toml: url,
# database, username, password). Without this a login created from that
# credential lands in config.env/secret_env keyed "url"/"database"/... --
# mcp-server-odoo reads ODOO_URL/ODOO_DB/ODOO_USER/ODOO_PASSWORD and never
# sees them.
#
# ODOO_API_KEY carries the SAME value as ODOO_PASSWORD (the credential's one
# `password` field, labelled "Odoo password or API key") under a second env
# var name -- not a second secret. mcp-server-odoo treats the two as
# different AUTH MODES, not interchangeable names for one value:
# ODOO_API_KEY alone selects its dedicated, correct API-key auth path;
# ODOO_PASSWORD alone makes it try a `/web/session/authenticate` interactive
# web-session login instead -- which Odoo deliberately refuses for an API
# key (a real password only), regardless of how many times the key is
# rotated. Live-observed 2026-08-26: every fresh API key failed identically
# with "no session cookie returned" until this was added. Setting both is
# exactly this library's own documented fallback design ("try API key auth,
# then username/password") -- see mcp_server_odoo/odoo_connection.py.
[connections.credential_env_fields]
ODOO_URL = "url"
ODOO_DB = "database"
ODOO_USER = "username"
ODOO_PASSWORD = "password"
ODOO_API_KEY = "password"

# Right classification for the bridge's tools (drives the frame check): reads vs.
# modifies. Modifies are the value-gated actions, so a department frame can
# require approval on them above a €-threshold.
#
# READ THIS BEFORE ADDING A GUARDRAIL ENTRY. These 9 tools are the entire
# alphabet every preset and every guardrails/ library entry is built from, and
# not one of them is scoped to a specific Odoo model -- so nothing in
# guardrails/ can restrict a call to "sale.order" versus "helpdesk.ticket", or
# tell a status-changing update apart from any other update.
[connections.scopes]
read = ["search_records", "get_record", "list_models", "list_resource_templates", "aggregate_records"]
modify = ["create_record", "update_record", "delete_record", "post_message"]

# How the bridge is launched. oc8 forwards only the env below and resolves the
# password from the secret store into ODOO_PASSWORD. `uv tool run` is used
# because the container's `uvx` shim mis-parses the package name as a subcommand.
[connections.config]
command = "uv"
args = ["tool", "run", "mcp-server-odoo"]

# NEUTRAL SEAM (outward_tools): which tools actually reach a PERSON. The core
# uses it for one rule only -- at most one message per record per task -- because
# a model having a bad turn will otherwise answer the same customer question
# twice in a single run. It happened; a mission rule did not stop it. Everything
# else here writes to the system, not to a human, and stays unlimited.
outward_tools = ["post_message"]

destructive_tools = ["delete_record"]
irreversible_tools = []
read_before_write = true
entity_lookup_tools = ["search_records"]

[connections.config.approval_templates]
post_message = "Allow {connection} to post a message on {record}?"
delete_record = "Allow {connection} to delete {record}?"

# NEUTRAL SEAM (outward_skip_spec): `post_message` writes BOTH an internal note
# (subtype "note", staff-only, never reaches the customer) and a genuine
# customer-visible reply (subtype "comment") through the same tool. Without
# this, the outward guard above cannot tell them apart -- it saw an internal
# note land on a ticket and refused the real reply right after as a "duplicate
# answer", so the ticket looked handled (note written, status changed) while
# the customer got nothing. Live, 2026-08-31: both fresh helpdesk tickets in
# this run's queue. A `subtype = "note"` call never counts as reaching anyone.
[connections.config.outward_skip_spec.post_message]
subtype = ["note"]

# NEUTRAL SEAM (tool_notes): free text appended to a specific tool's own
# description, applied generically by oc8.agent.tool_notes -- core has no
# idea this is about Odoo. This entry only ever grows by adding a SPECIFIC
# wrong guess a model actually made against THIS install, verified against
# the real data (fields_get / a live search) before being written down --
# it is not a general Odoo reference, because the generic remedy for
# everything else already exists as a tool: list_models.
#
# Known-wrong guesses on this install:
# - helpdesk.ticket has no `sla_date` field (verified via fields_get,
#   2026-08-26). A deterministic model (opaas_ai:odoo-gpt, which ignores
#   temperature) guessed it on every fresh "Manual run" trigger, since an
#   identical prompt always produces its identical first guess.
# - helpdesk.stage names on this install are the English defaults --
#   New / In Progress / On Hold / Solved / Cancelled -- never translated,
#   even though the rest of this install's UI runs in German. Claude
#   (claude-haiku-4-5) guessed the German "Neu" for a `stage_id.name`
#   filter and silently got zero results back instead of an error, live-
#   observed 2026-08-26 -- ticket #28 (real, in stage "New") went
#   invisible to a domain filtering for "Neu". Filtering `stage_id` (the
#   integer id, e.g. 1 for New) instead of `stage_id.name` sidesteps this
#   whole class of guess.
[connections.config.tool_notes]
search_records = "Field names vary per Odoo model -- if unsure, call list_models first rather than guessing. Known-wrong guesses on THIS install: helpdesk.ticket has no `sla_date` field -- use `create_date`, `write_date`, or `close_date` for ticket age/deadline ordering, `priority`/`stage_id`/`kanban_state` for triage, `user_id`/`team_id`/`partner_id` for who's involved. helpdesk.stage names here are the English defaults (New, In Progress, On Hold, Solved, Cancelled), never translated -- a `stage_id.name` filter for a translated guess (e.g. German \"Neu\") silently returns zero results instead of erroring. Prefer filtering `stage_id` by its integer id (1=New, 2=In Progress, 3=On Hold, 4=Solved, 5=Cancelled) over `stage_id.name` by a guessed string."
aggregate_records = "Field names vary per Odoo model -- if unsure, call list_models first rather than guessing. Known-wrong guesses on THIS install: helpdesk.ticket has no `sla_date` field -- use `create_date`, `write_date`, or `close_date` for ticket age/deadline ordering, `priority`/`stage_id`/`kanban_state` for triage, `user_id`/`team_id`/`partner_id` for who's involved. helpdesk.stage names here are the English defaults (New, In Progress, On Hold, Solved, Cancelled), never translated -- a `stage_id.name` filter for a translated guess (e.g. German \"Neu\") silently returns zero results instead of erroring. Prefer filtering `stage_id` by its integer id (1=New, 2=In Progress, 3=On Hold, 4=Solved, 5=Cancelled) over `stage_id.name` by a guessed string."

[connections.config.env]
ODOO_URL = "http://host.docker.internal:1000"
ODOO_DB = "oc8"
ODOO_USER = "admin"

[connections.config.secret_env]
ODOO_PASSWORD = "odoo/password"
ODOO_API_KEY = "odoo/password"

# NEUTRAL SEAM (value_spec): where the monetary value of a write lives, so the
# core's approval threshold can act on an Odoo offer without the core knowing
# anything about Odoo. A sale.order carries its value in order_line (price*qty);
# a lead carries it directly in expected_revenue.
[connections.config.value_spec]
direct_fields = ["expected_revenue", "amount_total", "amount_untaxed", "price_total", "price_subtotal"]

[connections.config.value_spec.line_items]
path = ["values", "order_line"]
price_field = "price_unit"
qty_field = "product_uom_qty"

# Named, typed attributes this connection's tools expose for "with limits"
# Conditions (generic condition model -- authz/pdp.py's Condition). The PDP
# itself knows nothing about order values or Odoo models; this is what lets a
# department author "IF order_value > 5000 THEN approval required" or
# "IF model == 'helpdesk.ticket' THEN not allowed" without any Odoo-specific
# code in the guardrail engine. order_value reuses the exact extraction shape
# `value_spec` above already declares (same fields, same line-item summing) --
# it is the first attribute to exist because that extraction already existed,
# not because the condition model treats it specially.
[[connections.guardrail_attributes]]
key = "order_value"
label = "Order value"
datatype = "number"
tools = ["create_record", "update_record"]

[connections.guardrail_attributes.extract]
direct_fields = ["expected_revenue", "amount_total", "amount_untaxed", "price_total", "price_subtotal"]

[connections.guardrail_attributes.extract.line_items]
path = ["values", "order_line"]
price_field = "price_unit"
qty_field = "product_uom_qty"

# A non-numeric example, proving the model is genuinely generic: which Odoo
# model a write touches (e.g. "crm.lead", "helpdesk.ticket") -- lets a
# condition say "not allowed for helpdesk.ticket" without a euro amount at all.
[[connections.guardrail_attributes]]
key = "model"
label = "Odoo model"
datatype = "string"
tools = ["create_record", "update_record", "delete_record"]

[connections.guardrail_attributes.extract]
field = "model"

# NEUTRAL SEAM (focus_spec): how to describe which record a call touches, for the
# live log. Only listed entities are surfaced.
[connections.config.focus_spec]
entity_field = "model"
id_fields = ["id", "record_id"]
# Where a record's human name sits in what a call RETURNS. The arguments never
# carry it -- an update sends an id and the fields to change -- so without this
# a task card can only ever say "Ticket #55". display_name first: it is the one
# Odoo itself shows.
id_field = "id"
title_fields = ["display_name", "name"]
name_path = ["values", "name"]
default_verb = "Bearbeitet"
search_tools = ["search_records", "aggregate_records"]
search_label = "Durchsucht"

# An entity that is NOT listed here produces no live-log line and no task label
# at all -- describe_focus returns None for it. That is why a helpdesk agent ran
# for an hour with an empty live log and a task card still showing the trigger's
# text: the models it works on were simply not named here.
[connections.config.focus_spec.labels]
"crm.lead" = "Lead"
"sale.order" = "Angebot"
"res.partner" = "Kontakt"
"helpdesk.ticket" = "Ticket"
"helpdesk.stage" = "Ticket-Stufe"
"helpdesk.team" = "Support-Team"
"mail.message" = "Gesprächsverlauf"

[connections.config.focus_spec.verbs]
create_record = "Erstellt"
update_record = "Bearbeitet"
get_record = "Öffnet"
post_message = "Notiert an"

# NEUTRAL SEAM (tool_labels / model_labels): how this connection's calls read
# to an end user in a run's step timeline. `search_records` is what the model
# calls; "Looked up deals" is what a salesperson sees. The core cannot write
# these -- it has never heard of a deal -- which is the same reason the
# guardrail presets and guardrail attributes above live here.
#
# ENGLISH ONLY, like every other authored string in this file. The German is
# in i18n/de.po, keyed by these exact strings, and any other locale works the
# same way the moment somebody adds a catalog for it.
#
# Placeholders are filled from the CALL: {model_label} is the model_labels
# entry for the call's own `model` argument, and any other {name} is a
# top-level argument of that name. A placeholder that cannot be filled makes
# the whole label fall back to the tool's right ("Read from odoo") rather
# than printing braces at somebody.
#
# NOTE, deliberately unresolved: [connections.config.focus_spec] above holds a
# SECOND, German, display mapping for the same models and verbs, used by the
# live log and task cards. The two overlap. Merging them changes live-log text
# for a running system, so it is not done here -- but the duplication is real
# and this comment is where the next person finds out about it.

[connections.tool_labels.search_records]
verb = "Looked up"
object = "{model_label}"
running = "Looking up {model_label}"

[connections.tool_labels.aggregate_records]
verb = "Counted"
object = "{model_label}"
running = "Counting {model_label}"

[connections.tool_labels.get_record]
verb = "Opened"
object = "{model_label} {id}"
running = "Opening {model_label} {id}"

[connections.tool_labels.list_models]
verb = "Checked which data is available"
running = "Checking which data is available"

[connections.tool_labels.list_resource_templates]
verb = "Checked which reports are available"
running = "Checking which reports are available"

[connections.tool_labels.create_record]
verb = "Created"
object = "a new {model_label} entry"
running = "Creating a new {model_label} entry"

[connections.tool_labels.update_record]
verb = "Updated"
object = "{model_label} {id}"
running = "Updating {model_label} {id}"

[connections.tool_labels.delete_record]
verb = "Deleted"
object = "{model_label} {id}"
running = "Deleting {model_label} {id}"

[connections.tool_labels.post_message]
verb = "Replied on"
object = "{model_label} {id}"
running = "Replying on {model_label} {id}"

# English plural nouns for the Odoo models this connection's agents touch,
# keyed by the raw value a call's `model` argument carries. A model absent
# here has no label, and a label that needs one falls back to the
# right-derived sentence rather than printing "crm.lead" at a user.
[connections.model_labels]
"crm.lead" = "deals"
"sale.order" = "quotes"
"res.partner" = "contacts"
"helpdesk.ticket" = "tickets"
"mail.message" = "messages"

# NEUTRAL SEAM (record_url): where one Odoo record lives, so an approval can
# link straight to the quotation it is about instead of making the approver go
# and find it (AI workplace design §6). Core substitutes exactly three names --
# {base_url}, {model}, {id} -- and knows nothing else about Odoo.
#
# Declared HERE, at the connection's top level, and NOT under
# [connections.config]: only the five DECLARED_SEAMS config keys are copied
# onto an already-installed connection (capas/materialise.py), and only on a
# re-enable. Everything at this level is read live off this file, so editing
# the line below takes effect within the discovery cache's 5s TTL with no
# re-install.
#
# `/odoo/<model>/<id>` is Odoo 17+'s web-client route. An older installation
# wants the hash form instead:
#   template = "{base_url}/web#id={id}&model={model}&view_type=form"
# One line, one file, no core change -- which is the whole reason this lives
# on the pack.
#
# base_url_path points at THIS connection's own env block below, which is what
# `credential_env_fields.ODOO_URL = "url"` rewrites from an attached login --
# so a customer's own host is used, never a literal from this file.
[connections.record_url]
template = "{base_url}/odoo/{model}/{id}"
base_url_path = ["env", "ODOO_URL"]

# Which entities are linkable. Deliberately the SAME set focus_spec.labels
# names (a test asserts that): an entity the live log describes is one an
# approval gets raised about, and a link that works for four models out of six
# is a link an approver stops trusting. mail.message is the exception and is
# listed anyway for symmetry -- Odoo resolves it to the record it hangs off.
[connections.record_url.models]
"crm.lead" = "crm.lead"
"sale.order" = "sale.order"
"res.partner" = "res.partner"
"helpdesk.ticket" = "helpdesk.ticket"
"helpdesk.stage" = "helpdesk.stage"
"helpdesk.team" = "helpdesk.team"
"mail.message" = "mail.message"
