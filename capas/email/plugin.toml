# Email: the agent's own mailbox at any provider. Mail comes in over IMAP or
# POP3 and goes out over SMTP, with a username and password (an app password
# works too). Everything that knows about mail lives in this capa; core only
# knows a polled event and a login.
#
# This file is the slim core. The tool pack is tool_pack.toml, the login type
# credential_types/mail_account.toml, the setup form setup/*.toml and the
# presets guardrails/<key>.toml.
#
# Mail servers on internal addresses. Core refuses loopback, private,
# link-local (cloud metadata) and other non-public addresses by default. A
# mail server on the company network needs the operator's allowlist twice:
# OC8_OUTBOUND_ALLOWED_PRIVATE for the poller and the connection test (they
# run in core), and OC8_MCP_EMAIL_ALLOWED_PRIVATE (same format) for the tools,
# which run in the bridge and see only OC8_MCP_* variables. Having the bridge
# follow OC8_OUTBOUND_ALLOWED_PRIVATE by itself is a follow-up.
#
# Mail servers with a certificate from a private CA. Certificates are always
# verified; there is no way to skip that. Either set SSL_CERT_FILE (or
# SSL_CERT_DIR) to a bundle holding the CA on the backend, worker and
# scheduler -- core passes both on to the bridge, so the poller, the
# connection test and the tools all trust it -- or paste the CA's certificate
# (PEM) into the login's `ca_certificate` field, which needs no change to the
# containers.
#
# Attachments travel as files of the run, not through the model:
# mail_get_attachment returns MCP binary content that core keeps as a run
# file, and mail_send/mail_reply/mail_forward take run-file ids in
# `attachments[].file` (marked `x-oc8-file`), which core resolves to the file
# before the call reaches the bridge. A sent mail is copied, marked read, to
# the Sent folder on IMAP (the login's `sent_folder`, else the folder marked
# \Sent, else a common name); a failed copy is a note, never a failed send,
# and keeping it may take 10 seconds a step at most. The copy names the Bcc
# recipients; the mail that goes out does not. `sent_folder = "-"` keeps no
# copy, and none is kept when the SMTP host is smtp.gmail.com,
# smtp.googlemail.com, smtp.office365.com or smtp-mail.outlook.com: those
# providers file sent mail themselves.
#
# Known limits of 1.1.0, accepted for now:
# * Daily send budgets come from core's guardrail usage limits: the
#   autonomous_with_limit preset allows at most 50 sends, replies and
#   forwards together per agent and UTC day (a mail counts once it was handed
#   to the mail tool, even if sending then failed; each mail may
#   have up to 50 recipients). The other presets bound sending
#   by the tools they reach and core's outward rule, one message per mail in
#   each task.

[plugin]
name = "email"
label = "Email"
version = "1.1.0"
type = "tool_pack"
trust = "first_party"
summary = "Give an agent its own mailbox over IMAP or POP3 and SMTP: read, search, send, reply and react to new mail"
permissions = ["mcp:connect", "secrets:use"]
capabilities = ["integration:email"]

# The `mail.received` poller (events/source.py). Core polls the mailbox the
# agent is fixed to for this capa's tools and starts the agent per new mail.
[plugin.entry_points]
event_sources = "events.source:register"

[[plugin.triggers]]
type = "mail.received"
label = "New email"
description = "Starts the agent when a new mail arrives in its mailbox. The mail is handed to the run as data, never as instructions."
polled = true
# The trigger editor's tab.
editor_label = "On new email"

# The trigger's one setting: the folder new mail is watched in (IMAP; POP3
# only has the inbox and ignores it).
[[plugin.triggers.config]]
key = "folder"
label = "Folder"
default = "INBOX"
