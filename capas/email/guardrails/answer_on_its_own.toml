# The agent answers mail on its own: it reads, replies and marks mail read,
# without approval. It cannot start new conversations (mail_send), pass mail
# on (mail_forward), or move or delete mail. A preset limits tools, not their
# arguments, so a reply may go to everyone on the mail (reply_all).
# It has no daily counter (autonomous_with_limit has one). What bounds it is
# core's outward rule, one reply per mail in each task.
# Whoever writes gets an answer, so a stranger can ask it about anything it
# can read; the summary says so and points sensitive mailboxes at
# send_with_approval. A reply follows Reply-To only on the sender's own
# domain (mailbox.reply), so a mail cannot point the answer elsewhere.
kind = "preset"
connection = "primary"
key = "answer_on_its_own"
label = "Answer on its own"
summary = "Reads mail and answers it on its own, without approval: it can reply (also to everyone on a mail) and mark mail read. It answers anyone who writes, and may tell them what it knows. It cannot send new mail, forward, move or delete mail. There is no daily limit; in each task it replies to a mail at most once. For a mailbox with sensitive mail, choose Approval before sending."
recommended = false
read = true
modify = true
approval_actions = []
approval_eur = ""
only = [
    "mail_list_folders", "mail_search", "mail_get", "mail_get_attachment",
    "mail_reply", "mail_mark_read",
]
