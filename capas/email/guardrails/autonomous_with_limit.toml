# "With a limit" here means a narrower surface, not a counter: the guardrail
# model has no per-day send budget, so the limit is what the agent can reach.
# It sends, replies and files mail on its own, but never deletes or forwards.
kind = "preset"
connection = "primary"
key = "autonomous_with_limit"
label = "Autonomous with a limit"
summary = "Reads, sends, replies, moves and marks mail on its own, without approval. It cannot delete mail or forward it. Core allows one new mail and one reply per mail in each task."
recommended = false
read = true
modify = true
approval_actions = []
approval_eur = ""
only = [
    "mail_list_folders", "mail_search", "mail_get", "mail_get_attachment",
    "mail_send", "mail_reply", "mail_move", "mail_mark_read",
]
