name = "qdrant_api"
display_name = "Qdrant"
validate_entry_point = "credential:validate_qdrant"

[[fields]]
key = "url"
label = "URL"
kind = "url"
help = "Qdrant HTTP API base, e.g. https://qdrant.example.com:6333"

[[fields]]
