[plugin]
name = "codex_runtime"
version = "0.1.1"
type = "runtime_adapter"
trust = "first_party"
label = "Codex"
summary = "Run agents with the OpenAI Codex CLI in its own container -- native file/bash tools inside the sandbox, oc8's gateway for anything governed"
permissions = ["sandbox:run"]
# `checkpoints` deliberately absent -- same reasoning as claude_code_runtime's
# own manifest (and nanoclaw_runtime's before it): this runtime's container
# is opaque to the in-process checkpoint mechanism, so the fail-closed
# negotiation keeps supervised agents off it.
capabilities = ["skills"]

[plugin.entry_points]
runtime = "runtime.runtime:register"
