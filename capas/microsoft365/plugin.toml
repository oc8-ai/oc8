# Microsoft 365 (Graph API) as both a knowledge source AND an MCP tool pack --
# ONE plugin, deliberately. Neither the connector registry nor tool-pack
# materialization gates on this file's `type` field (see the design doc §1),
# so declaring type = "tool_pack" here while ALSO shipping a `connectors`
# entry point is not a workaround, it's the confirmed-working shape.
#
# This file is the slim core only. The tool pack lives in tool_pack.toml, the
# guardrail presets and the curated library in guardrails/<key>.toml, and the
# setup form in setup/*.toml (design §2/§3).

[plugin]
name = "microsoft365"
label = "Microsoft 365"
version = "1.1.0"
type = "tool_pack"
trust = "first_party"
summary = "Connect Microsoft 365 — SharePoint/OneDrive knowledge base, plus Outlook, Calendar, Teams, Word, Excel and PowerPoint tools"
permissions = ["knowledge:write", "mcp:connect", "secrets:use"]
capabilities = ["integration:microsoft365"]

[plugin.entry_points]
connectors = "connector.connector:register"
