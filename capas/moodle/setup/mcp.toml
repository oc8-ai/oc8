# Must stay IDENTICAL to tool_pack.toml's own `connections.config` command/args:
# both describe launching the same bridge.
connection_key = "primary"
name = "moodle"
command = "python"
args = ["-m", "mcp_bridge"]
department_field = "department"

# `url` is not a field of this form: it rides along from the moodle_token
# credential the `site` field references (api/v1/capas.py writes every
# credential field into the submitted values).
[env_fields]
MOODLE_URL = "url"

[secret_env_fields]
MOODLE_TOKEN = "site"
