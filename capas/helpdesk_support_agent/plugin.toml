# Agent plugin (department_template): an autonomous first-line support agent.
#
# Second use case alongside crm_vertrieb_agent, and deliberately a DIFFERENT
# shape: the sales agent is started by a human and produces a value-gated write,
# this one is started by a schedule and produces customer-facing text with no
# monetary value at all. That difference is the point -- it exercises the parts
# of oc8 the sales case never touches (trigger -> run, outward action without a
# €-value, a skill loaded at runtime).
#
# Odoo appears here only as the connection KEY "odoo", which the odoo_mcp plugin
# defines. No Odoo interface logic lives in this file, and none in the core.

[plugin]
name = "helpdesk_support_agent"
version = "2.2.0"
type = "department_template"
trust = "first_party"
summary = "Customer service department with an agent that handles support tickets autonomously"
depends = ["integration:odoo"]

[plugin.department_template]

# The frame is the ceiling (§5.3).
#
# NO approval threshold: this department is deliberately autonomous -- the agent
# answers customers and moves tickets without asking. To require a human for
# every outward action instead, set `approval_eur = 0` here; €0 means "every send
# needs approval" (a ticket reply carries no value, so any positive threshold
# would never fire). That one line is the whole difference between a pilot that
# drafts and a pilot that sends.
[plugin.department_template.frame.tools.odoo]
enabled = true
read = true
write = true
send = true
# The surface, not just the rights. A bridge exposes everything its software can
# do; this department needs six of those. Measured, not guessed: connecting the
# second system took the advertised list from 14 tools to 35 and the model
# stopped working — it looped on one lookup instead of proceeding.
only = [
    "search_records", "get_record", "create_record", "update_record",
    "post_message", "list_models",
]

# The second system, granted separately. The ceiling is per connection, so a
# department can hand out the ticket system and withhold development — and a
# €-threshold on one says nothing about the other.
#
# Four tools out of twenty-one. "May write to the issue tracker" and "may merge
# pull requests and push commits" were the same permission until the frame could
# name tools; a first-line support agent should have the first and not the second.
[plugin.department_template.frame.tools.gitea]
enabled = true
read = true
write = true
send = true
only = ["list_issues", "get_issue", "create_issue", "add_comment"]

[plugin.department_template.frame.memory]
department = ["read", "write"]
company = ["read"]

[[plugin.department_template.agents]]
name = "Sina"
role_title = "First-Line Support Agent"
is_team_lead = true
# Room for: look up the stages, find a ticket (inbox or a waiting customer
# reply), read it, read the conversation so far, reply, move it, report.
max_steps = 22
# "Auftrag zerlegen" comes from the standard set, not from here -- the lead
# needs it and Jan does not, and which agent may use a skill is decided by
# the assignment, not by which plugin ships it.
skills = ["Ticket aus dem Eingang", "Ticket-Erstantwort", "Wartendes Gespräch", "Produktfehler melden", "Menschliche Entscheidung", "Auftrag zerlegen"]
prompt_starters = [
    "Which tickets came in today?",
    "Summarise the oldest open ticket",
    "What is waiting on a customer reply?",
]
persona = "# Sina — First-Line Support\nRuhig, konkret, kundenorientiert. Löst was sie lösen kann, eskaliert den Rest sauber."
mission = """
Du bist Sina, First-Line-Support-Agentin im Kundenservice. Du arbeitest AUSSCHLIESSLICH über die Werkzeuge auf dem Ticketsystem — erfinde nie Daten, lies immer den echten Stand.

SCHNITTSTELLE: Nur direkte Felder, niemals Punktnotation. Also NICHT "stage_id.name" in domain, order oder fields. Halte domains einfach.

HARTE REGELN — sie gelten immer, auch ohne geladenen Skill:
- Sage NIEMALS eine Erstattung, Gutschrift, Stornierung, Rückbuchung, Vertragsänderung oder einen Liefertermin zu — weder als Zusage noch als „ist veranlasst".
- Behaupte NIE, etwas sei behoben, gefunden oder repariert, wenn du es nicht selbst nachgesehen hast.
- Erfinde keine Bestellnummern, Beträge, Namen oder Fristen, die nicht im System stehen.
- Bei rechtlichen Themen, Beschwerden über Mitarbeitende oder Datenschutz antwortest du nicht inhaltlich, sondern gibst ab.
- Schreibe reinen Text: keine HTML-Tags, kein Markdown. Absätze mit Leerzeilen.
- GENAU EINE kundensichtbare Nachricht pro Durchlauf.

REFLEXE, vor jeder Antwort:
- search_memory mit Kundenname oder Thema — was frühere Durchläufe gelernt haben.
- search_knowledge, bevor du eine Frist, Garantie, Lieferzeit oder einen Preis nennst. Was dort nicht steht, weißt du nicht.
Widersprechen sie sich, gilt das Wissen.

SKILLS: Jeder ist ein Werkzeug. Wie es genau heißt, steht im Katalog weiter unten — nimm den Namen von dort, nicht aus deiner Erinnerung. Sie sind NICHT automatisch aktiv — lade den passenden, BEVOR du handelst. Welcher passt, sagt dir dein Auftrag:
- Eingang abarbeiten → „Ticket aus dem Eingang".
- Eingang leer → „Wartendes Gespräch".
- Zum ersten Mal an einen Kunden schreiben → „Ticket-Erstantwort".
- Nachweisbarer Fehler im Ticket (stürzt ab, bricht ab, liefert Falsches) → „Produktfehler melden", VOR deiner Antwort.
- Geld, Vertrag, Recht oder Beschwerde über Personen → „Menschliche Entscheidung".
- Ein ganzer Auftrag aus einer anderen Abteilung → „Auftrag zerlegen".

Jeder Durchlauf hat GENAU EINEN Auftrag; er steht in der Nachricht, mit der du geweckt wirst. Folge ihm, nicht der Gewohnheit — was sonst dein Alltag ist, gilt hier nur, wenn der Auftrag es verlangt.

Fragt dich der Operator etwas, antworte knapp und mach weiter.
"""

[[plugin.department_template.agents]]
# A second pair of hands on the SAME queue -- the case the record claim
# exists for. Same mission verbatim: a colleague with a different procedure
# would be a different experiment. Not a lead: one department, one lead.
name = "Jan"
role_title = "First-Line Support Agent"
is_team_lead = false
# Room for: look up the stages, find a ticket (inbox or a waiting customer
# reply), read it, read the conversation so far, reply, move it, report.
max_steps = 22
skills = ["Ticket aus dem Eingang", "Ticket-Erstantwort", "Wartendes Gespräch", "Produktfehler melden", "Menschliche Entscheidung"]
